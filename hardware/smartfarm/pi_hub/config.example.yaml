# 이 파일을 config.yaml로 복사한 뒤 값을 채운다. config.yaml은 git에 커밋하지 않는다.
mqtt:
  host: "localhost"   # Mosquitto가 이 라즈베리파이에서 도는 경우 localhost
  port: 1883

db_path: "smartfarm.db"

# 구역을 늘릴 때는 여기 항목만 추가한다 (허브 코드 변경 불필요).
zones:
  zone1:
    soil_min_pct: 30       # 이 값 밑으로 내려가면 급수 시작
    soil_target_pct: 60    # 이 값 이상 회복하면 급수 중단 (soil publish 주기마다 재확인)
    water_duration_s: 10   # 급수 지속 시간 (ESP32측 PUMP_MAX_RUN_MS보다 짧게 설정)
    cooldown_s: 300         # 급수 종료 후 재판단까지 최소 대기 시간(연속 펌프질 방지)

    # [센서 고장 판정 - 선택] 정상 센서가 낼 수 있는 raw ADC 범위.
    # 퍼센트 값은 map()+constrain()으로 눌려서 단선된 센서도 '0%'(바싹 마름)처럼 보이므로,
    # 고장 판정은 가공 전 raw 로만 가능하다. 이 범위를 벗어나면 급수를 보류하고
    # 이미 급수 중이었다면 즉시 중단한다 (물을 안 주는 쪽이 안전한 실패 방향).
    # 두 값은 반드시 함께 설정한다. 생략하면 raw 검증을 하지 않는다(구버전 펌웨어 호환).
    # 실측 캘리브레이션(공기 중/완전 침수) 바깥으로 여유를 준 값을 넣는다.
    #   예) ESP8266 10비트, 공기 768 / 침수 381 -> soil_raw_min: 300, soil_raw_max: 850
    #   예) ESP32 12비트라면 0~4095 스케일에 맞춰 다시 실측할 것
    # soil_raw_min: 300
    # soil_raw_max: 850
